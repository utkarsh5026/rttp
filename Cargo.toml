[package]
name = "rttp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Utkarsh Priyadarshi"]
description = "A from-scratch async HTTP/1.1 server framework in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/utkarsh5026/rttp"
keywords = ["http", "server", "async", "web", "framework"]
categories = [
    "network-programming",
    "web-programming::http-server",
    "asynchronous",
]

[features]
default = []
oauth = ["reqwest"]

[lib]
name = "rttp"
path = "src/lib.rs"


[dependencies]
# Async runtime — selective features for leaner compile times in library consumers
tokio = { version = "1", features = [
    "net",
    "io-util",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }

# Zero-copy HTTP/1.x push parser
httparse = "1"

# Ergonomic error derive macros
thiserror = "2"

# Tokio-ecosystem byte buffer
bytes = "1"

# Structured logging (consumers wire up their own subscriber)
tracing = "0.1"

# Serialization/deserialization framework
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT signing and verification
jsonwebtoken = "9"

# Password hashing (Argon2id)
argon2 = { version = "0.5", features = ["password-hash"] }
# Pinned to 0.6 to match password-hash's rand_core version; enables OsRng
rand_core = { version = "0.6", features = ["getrandom"] }

# Base64 encoding/decoding
base64 = "0.22"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }

# URL query string deserialization
serde_urlencoded = "0.7"

# Percent-encoding for URL decoding
percent-encoding = "2"
getrandom = "0.4.2"

# Ergonomic async trait support
async-trait = "0.1"

# HTTP client for JWKS/OIDC discovery (oauth feature only)
reqwest = { version = "0.12", features = ["rustls-tls", "json"], optional = true }

[dev-dependencies]
# Full tokio runtime for examples and integration tests
tokio = { version = "1", features = ["full"] }
# Subscriber for examples — not exposed to library consumers
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "todo_api"
path = "examples/todo_api.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1  # line tables only — faster link, smaller binary
split-debuginfo = "unpacked"  # keep debug info in .dwo files — faster incremental links

[profile.dev.package."*"]
opt-level = 2  # compile deps at O2 even in dev (tokio, bytes, etc.)
